name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Audio-Capture-Android.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AI-Audio-Capture-Android.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build APK
        working-directory: project/AI-Audio-Capture-Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Capture-APK
          path: project/AI-Audio-Capture-Android/app/build/outputs/apk/debug/*.apk

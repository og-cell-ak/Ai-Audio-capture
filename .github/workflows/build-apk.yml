name: Build Android APK V4.3

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Audio-Capture-Diagnostic-V4.3.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V4.3 ZIP
        run: |
          echo "Checking V4.3 project ZIP..."
          ls -lh
          test -f AI-Audio-Capture-Diagnostic-V4.3.zip

      - name: Extract V4.3 project
        run: |
          rm -rf project
          mkdir project
          unzip -q AI-Audio-Capture-Diagnostic-V4.3.zip -d project

      - name: Show project structure
        run: |
          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          unzip -q gradle-9.6.1-bin.zip
          echo "$PWD/gradle-9.6.1/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build V4.3 Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Built APK files:"
          find project/app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -n "$(find project/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload V4.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Capture-V4.3-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Audio-Capture-Android.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AI-Audio-Capture-Android.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          unzip -q gradle-9.6.1-bin.zip
          echo "$PWD/gradle-9.6.1/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        working-directory: project/AI-Audio-Capture-Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Capture-APK
          path: project/AI-Audio-Capture-Android/app/build/outputs/apk/debug/*.apk
